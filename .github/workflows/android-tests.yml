name: Android tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --no-parallel

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare requested user-test image
        run: |
          mkdir -p app/src/androidTest/assets
          if curl --fail --location --silent --show-error https://cdn.britannica.com/46/63146-050-D6F89DED/Kanji-characters.jpg --output /tmp/requested_user_image.jpg; then
            mv /tmp/requested_user_image.jpg app/src/androidTest/assets/requested_user_image.jpg
          else
            echo "Requested external image unavailable; its optional device test will be skipped."
          fi

      - name: Run UI and Japanese OCR tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene -skin 1080x2340
          disable-animations: true
          script: |
            ./gradlew assembleDebug --no-parallel
            curl --fail --location --silent --show-error https://github.com/dyjagger/yomilens/releases/download/v0.1.3/YomiLens-universal.apk --output /tmp/YomiLens-v0.1.3.apk
            curl --fail --location --silent --show-error https://github.com/dyjagger/yomilens/releases/download/v0.1.4/YomiLens-universal.apk --output /tmp/YomiLens-v0.1.4.apk
            adb install /tmp/YomiLens-v0.1.3.apk
            adb install -r /tmp/YomiLens-v0.1.4.apk
            adb shell dumpsys package app.yomilens | grep -q 'versionCode=5'
            adb uninstall app.yomilens
            ./gradlew connectedDebugAndroidTest --no-parallel
            grep -R 'YomiLensExternal' app/build/outputs/androidTest-results/connected/debug || true

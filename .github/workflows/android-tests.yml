name: Android tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YOMILENS_KEYSTORE_PATH: /tmp/yomilens-debug.keystore

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore stable prototype signing key
        env:
          PROTOTYPE_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$PROTOTYPE_KEYSTORE_BASE64"
          printf '%s' "$PROTOTYPE_KEYSTORE_BASE64" | base64 --decode > "$YOMILENS_KEYSTORE_PATH"
          chmod 600 "$YOMILENS_KEYSTORE_PATH"
          keytool -list -v -keystore "$YOMILENS_KEYSTORE_PATH" -storepass android -alias androiddebugkey | grep -q '75:FF:40:3E:7D:05:20:C6:87:C7:22:57:0F:01:6F:87:1F:93:8A:8D:F3:1D:65:6B:C3:36:B6:B4:2A:D8:AA:D7'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --no-parallel

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare requested user-test images
        run: |
          mkdir -p app/src/androidTest/assets
          if curl --fail --location --silent --show-error https://cdn.britannica.com/46/63146-050-D6F89DED/Kanji-characters.jpg --output /tmp/requested_user_image.jpg; then
            mv /tmp/requested_user_image.jpg app/src/androidTest/assets/requested_user_image.jpg
          else
            echo "Requested external image unavailable; its optional device test will be skipped."
          fi
          curl --fail --location --silent --show-error 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Wikipe-tan_manga_page1.jpg' --output /tmp/open_licensed_manga_page.jpg
          echo 'a2858a02ceabf0ca2fa2255c772e31af7e5d1f93b28a9acc0cb31cb169fbbf2c  /tmp/open_licensed_manga_page.jpg' | sha256sum --check
          mv /tmp/open_licensed_manga_page.jpg app/src/androidTest/assets/open_licensed_manga_page.jpg

      - name: Run UI and Japanese OCR tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene -skin 1080x2340
          disable-animations: true
          script: |
            ./gradlew assembleDebug --no-parallel
            curl --fail --location --silent --show-error https://github.com/dyjagger/yomilens/releases/download/v0.1.6/YomiLens-universal.apk --output /tmp/YomiLens-v0.1.6.apk
            adb install /tmp/YomiLens-v0.1.6.apk
            adb install -r app/build/outputs/apk/debug/app-universal-debug.apk
            adb shell dumpsys package app.yomilens | grep -q 'versionCode=8'
            adb uninstall app.yomilens
            ./gradlew connectedDebugAndroidTest --no-parallel
            grep -R 'YomiLensExternal' app/build/outputs/androidTest-results/connected/debug || true
